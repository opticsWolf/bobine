# Release workflow: build bobine on Linux/macOS/Windows, verify, publish to PyPI.
#
# Triggers on version tags, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
#
# bobine is pure Python, so the wheel is platform-independent
# (`py3-none-any`): the cross-platform matrix is for VERIFICATION (lint,
# tests, tag/version guard, zero-dependency wheel smoke test) on each OS,
# and every platform uploads its build artifacts. The publish job merges the
# (byte-identical) artifacts from all platforms and publishes once.
#
# Publishing uses PyPI **trusted publishing** (OpenID Connect) — no API
# tokens stored in secrets. One-time setup on PyPI:
#   1. https://pypi.org/manage/account/publishing/ → "Add a new publisher"
#   2. Project: bobine · Workflow: release.yml · Environment: pypi
#      (use the TestPyPI equivalent for the `testpypi` variant below).
#
# Job layout:
#   build          → matrix [ubuntu | macos | windows] × [py3.10…3.13]:
#                    lint + unit tests (bare install) + `uv build` + wheel
#                    smoke test (zero-dependency import) + artifact upload
#   publish-pypi   → trusted publish of the merged sdist + wheel to PyPI
#   github-release → draft a GitHub Release with the artifacts attached

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build & verify (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (bare + dev)
        run: uv sync --extra dev --extra markdown --frozen

      - name: Lint + format
        run: uv run ruff check . && uv run ruff format --check .

      - name: Unit tests (no native backends)
        run: uv run pytest -m "not integration" -q

      - name: Tag/version consistency
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(uv run python -c 'import bobine; print(bobine.__version__)')"
          echo "tag=$tag pkg=$pkg"
          test "$tag" = "$pkg"

      - name: Build sdist + wheel
        run: uv build

      - name: Wheel smoke test (zero-dependency import)
        shell: bash
        run: |
          VENV="${{ runner.temp }}/wheelcheck"
          python -m venv "$VENV"
          python -m pip install --no-deps dist/bobine-*.whl
          PY="$VENV/bin/python"          # POSIX (linux / macos)
          [ -x "$PY" ] || PY="$VENV/Scripts/python.exe"  # Windows
          "$PY" -c \
            "import bobine; print('wheel ok:', bobine.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC) — no token secret
    steps:
      - name: Collect artifact
        # The wheel is py3-none-any and byte-identical across the whole
        # build matrix (the matrix is pure per-OS/per-version verification),
        # so take one verified copy. merge-multiple:true is avoided here:
        # merging 12 artifacts with identical paths is known to corrupt
        # the zip central directory (BadZipFile on the wheel).
        uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu-latest-py3.13
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # Optional companion: draft a GitHub Release with the artifacts. Remove
  # this job (and the `contents: write` permission it declares) if you only
  # want PyPI.
  github-release:
    name: draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect artifact
        # Single verified copy — see publish-pypi for why merge-multiple
        # is avoided (identical paths across 12 artifacts corrupt zips).
        uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu-latest-py3.13
          path: dist/

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**

  # Publish to TestPyPI instead (dry run): swap `environment` to `testpypi`
  # and the publish step's repository to testpypi, e.g.:
  #   environment: testpypi
  #   uses: pypa/gh-action-pypi-publish@release/v1
  #   with:
  #     packages-dir: dist/
  #     repository-url: https://test.pypi.org/legacy/
