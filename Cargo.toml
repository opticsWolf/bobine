[package]
name = "bobine_rs"
version = "0.1.0"
edition = "2024"
description = "PDF / Office / text → Markdown ingestion engine (Rust core with Python bindings)"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/opticsWolf/bobine"
authors = ["opticsWolf <opticswolf@protonmail.com>"]

[lib]
name = "bobine_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Document parsing
pdf_oxide = { version = "0.3", features = ["rendering"] }
office_oxide = "0.1"

# ONNX Runtime (for TexTeller formula OCR)
ort = { version = "2.0.0-rc.13", features = ["load-dynamic"] }

# HuggingFace tokenizers (BPE tokenizer for TexTeller RoBERTa decoder)
tokenizers = "0.21"

# Image preprocessing
image = "0.25"

# Array operations (matches ort's ndarray version)
ndarray = "0.17"

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Regex (for whitespace-tolerant text splicing)
regex = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Python bindings
pyo3 = { version = "0.29", features = ["extension-module"] }
hf-hub = { version = "1.0", features = ["blocking"] }

[dev-dependencies]
serde_json = "1"
