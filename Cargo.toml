[package]
name = "bobine"
version = "0.5.9"
edition = "2024"
rust-version = "1.85"
description = "PDF / Office / text → Markdown ingestion engine with ONNX formula OCR (TexTeller), layout analysis and OCR"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/opticsWolf/bobine"
homepage = "https://github.com/opticsWolf/bobine"
documentation = "https://github.com/opticsWolf/bobine/docs"
authors = ["opticsWolf <opticswolf@protonmail.com>"]
readme = "README.md"
keywords = ["pdf", "markdown", "ocr", "latex", "formula"]
categories = ["text-processing", "parsing"]
# Keep the crates.io upload under the 10 MB limit: integration fixtures
# (5.9 MB PDFs), golden snapshots, and the frozen Python reference tree
# (6.3 MB) ship in git but not in the published crate. Library unit tests
# live in src/ and still run downstream; tests/ + examples/ stay as API
# documentation (examples need no fixtures at compile time).
exclude = ["legacy/", "tests/fixtures/", "tests/golden/"]

[lib]
name = "bobine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Opt-in PyO3 bindings (`python/bobine`, maturin builds with this feature).
# The pure-Rust crate on crates.io builds without it — no Python linking.
extension-module = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
# Document parsing
pdf_oxide = { version = "0.3", features = ["rendering"] }
office_oxide = "0.1"

# ONNX Runtime (TexTeller / RapidLayout / RapidOCR).
# load-dynamic: the shared library is located at runtime (ORT_DYLIB_PATH).
# Provider features below only gate registration code — nothing links.
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "cuda", "rocm", "directml", "openvino", "coreml", "tensorrt", "half"] }

# HuggingFace tokenizers (BPE tokenizer for TexTeller RoBERTa decoder)
tokenizers = "0.21"

# HuggingFace Hub model download (blocking client)
hf-hub = { version = "1.0", features = ["blocking"] }

# Image preprocessing
image = "0.25"

# Array operations (matches ort's ndarray version)
ndarray = "0.17"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CSV writing (Excel sheet export)
csv = "1"

# Asset hashing (okf-asset:// ids)
sha2 = "0.10"

# Thought-document ids (uuid4)
uuid = { version = "1", features = ["v4"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Regex (whitespace-tolerant text splicing, table parsing)
regex = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Python bindings (optional — only for the extension-module build)
pyo3 = { version = "0.29", optional = true }

[dev-dependencies]
half = "2"
