name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,markdown]"
          pip install pytest-cov ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test (unit)
        run: pytest -m "not integration" --cov=bobine --cov-report=term-missing
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: .coverage

  integration:
    name: integration (real backends)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with native backends
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pdf-ingest,markdown,dev]"
      - name: Test (integration)
        run: pytest -m integration -q
      - name: Test (full suite)
        run: pytest -q
