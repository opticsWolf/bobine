# NOTE: originally `maturin generate-ci github`, then trimmed to the
# release matrix (ubuntu/windows x86_64 + macos arm64). Do NOT regenerate
# blindly — it brings back x86/armv7/s390x/ppc64le/musllinux/windows-arm.
#
name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - rust_dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Rust test suite — runs on every push/PR so dependency updates
  # (e.g. pdf_oxide) can't silently shift golden output.
  # Needs onnxruntime: lib tests abort without a resolvable dylib
  # (STATUS_STACK_BUFFER_OVERRUN); the pinned PyPI wheel supplies it.
  # Model-backed tests skip or degrade gracefully; fixtures are committed
  # (RapidTable weights may download from HuggingFace).
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      # plan-onnx-only Phase 0: no torch stack in shipped code or deps
      # (legacy/ is the superseded Python bobine, not packaged).
      - name: No torch stack in shipped code or dependencies
        run: |
          if git grep -nE '^\s*(import|from)\s+(torch|torchvision|transformers|optimum|sentence_transformers)\b' -- '*.py' ':!tests/' ':!docs/' ':!legacy/'; then
            echo 'torch-stack import in shipped code'; exit 1
          fi
          if grep -nE '^\s*"?(torch|torchvision|transformers|optimum|sentence-transformers|tch|candle-transformers)\b' pyproject.toml Cargo.toml; then
            echo 'torch-stack dependency'; exit 1
          fi
          echo 'torch-free'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Same ORT as the pyproject extras pin (single pinned runtime, COMPAT.md).
      # Use the PyPI wheel: the upstream GitHub release asset URL can return
      # a 404 page, which curl -sL previously saved as if it were a tarball.
      - name: Install onnxruntime (CPU)
        run: |
          python -m pip install --disable-pip-version-check --no-input "onnxruntime==1.31.1"
          python - <<'PY'
          import os
          import sysconfig
          from pathlib import Path

          capi = Path(sysconfig.get_paths()["purelib"]) / "onnxruntime" / "capi"
          library = capi / "libonnxruntime.so.1.31.1"
          if not library.is_file():
              raise SystemExit(f"ONNX Runtime library not found: {library}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ORT_DYLIB_PATH={library}\n")
              env.write(f"LD_LIBRARY_PATH={capi}:{os.environ.get('LD_LIBRARY_PATH', '')}\n")
          PY
      - name: Rust tests (locked)
        run: >
          cargo test --locked --lib
          --test test_office --test test_excel
          --test test_golden --test test_rapid_table
          --test test_converter

  # Wheel smoke builds — same three platforms as release.yml.
  # (CI proves the build; release.yml publishes it.)
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter --locked
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # 2_28 (AlmaLinux 8, OpenSSL 1.1.1): `auto` resolves to the
          # CentOS 7-based manylinux2014 whose OpenSSL 1.0.2 predates what
          # openssl-sys 0.9.117 accepts (needs 1.1.0+). glibc floor stays
          # modest (2.28: Ubuntu 20.04+ / Debian 11+).
          manylinux: 2_28
          # ort-sys build-deps on ureq/native-tls → openssl-sys needs the
          # headers inside the manylinux container (host apt won't reach it).
          before-script-linux: yum install -y openssl-devel
      # The bindings tests (plan B2): a fresh interpreter must not import
      # `onnxruntime` when bobine is imported, and the runtime decision
      # must still be made. Standard library only — no pytest, no models.
      - name: Bindings tests (runtime discovery)
        run: |
          # dist/ holds one wheel per interpreter (maturin --find-interpreter);
          # let pip pick the one matching this runner's Python instead of
          # globbing them all. --no-index: bobine has no runtime deps.
          python -m pip install --quiet --no-index --find-links dist bobine
          python -m unittest discover -s python/tests -v
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-x86_64
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter --locked
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist --find-interpreter --locked
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-aarch64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

