# Release workflow — dual publish on version tags.
#
# Tag `vX.Y.Z` on **main** (after merging dev) triggers:
#   1. crates.io  — pure-Rust crate `bobine` (default features, no pyo3)
#   2. PyPI       — full Python package `bobine` via maturin (extension-module)
#
# Required secrets / configuration:
#   - secrets.CARGO_REGISTRY_TOKEN   → crates.io API token
#   - PyPI trusted publisher configured for this workflow + environment `pypi`
#     (Project: bobine · Workflow: release.yml · Environment: pypi)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1. crates.io — Rust library (no Python bindings)
  # ------------------------------------------------------------------
  crates-io:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Tag-only: on workflow_dispatch GITHUB_REF_NAME is the branch, so
      # the comparison can't pass — skip it there instead of going red.
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          test "$tag" = "$ver" || { echo "tag v$tag != Cargo.toml $ver"; exit 1; }
      - name: Verify default build is Python-free
        run: cargo check --locked
      - name: Download onnxruntime (CPU — lib tests abort without a dylib)
        run: |
          curl -sL --max-time 300 -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-linux-x64-1.29.0.tgz
          mkdir -p /tmp/ort && tar xzf /tmp/ort.tgz -C /tmp/ort
      - name: Run library unit tests (integration needs onnxruntime)
        env:
          ORT_DYLIB_PATH: /tmp/ort/onnxruntime-linux-x64-1.29.0/lib/libonnxruntime.so.1.29.0
        run: cargo test --locked --lib
      - name: Publish to crates.io
        # Tags publish; manual dispatch is a dry-run (check + test only).
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ------------------------------------------------------------------
  # 2. PyPI — Python wheel matrix via maturin (trusted publishing)
  # ------------------------------------------------------------------
  pypi:
    # Full wheel matrix (0.7.2+): cp310-cp314 x
    # {manylinux x86_64+aarch64, musllinux x86_64, windows x64, macos arm64}.
    # Deliberate skips (do not re-add blindly):
    # - macos x86_64: no Intel runners (retired); cross-built wheels can't
    #   be execute-tested on arm64 runners, and Intel Macs are EOL hardware.
    # - musllinux: CUT after a proven CI failure (0.7.2 dry run 40830872409).
    #   maturin-action runs before-script-linux on the host, so the musl
    #   container never gets its openssl headers and openssl-sys fails.
    #   Fixing that needs action-level surgery, disproportionate for a
    #   packaging release; sdist remains for Alpine users. Revisit on demand.
    # - 32-bit / armv7 / s390x / ppc64le / windows-arm: no downstream demand.
    # - cp39: requires-python floor is 3.10 (3.9 EOL Oct 2025); sdist covers
    #   anyone truly stuck there.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: manylinux_2_28
            pkg: yum install -y openssl-devel
          - runner: ubuntu-22.04-arm
            target: aarch64
            manylinux: manylinux_2_28
            pkg: yum install -y openssl-devel
          # musl Linux leg CUT (see matrix skips below) — kept out of the
          # matrix until the before-script problem is solved upstream.
          - runner: windows-latest
            target: x64
            manylinux: off
          - runner: macos-latest
            target: aarch64
            manylinux: off
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v6

      # Non-Linux legs build against exactly this interpreter (maturin
      # uses the PATH interpreter when -i matches it). Linux legs build
      # inside the manylinux/musllinux container, which carries its own
      # interpreters — setup-python is skipped there.
      - uses: actions/setup-python@v5
        if: matrix.platform.manylinux == 'off'
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # Explicit -i: maturin otherwise builds for a single discovered
          # interpreter (0.7.1 shipped one wheel per platform that way).
          # Bare versions resolve against the container's /opt/python on
          # Linux and against setup-python's PATH entry on win/mac.
          args: --release --out dist --locked --features extension-module -i ${{ matrix.python-version }}
          # 2_28, not auto: auto resolves to CentOS 7-based manylinux2014
          # (OpenSSL 1.0.2 < openssl-sys minimum 1.1.0). Ignored on win/mac.
          manylinux: ${{ matrix.platform.manylinux }}
          sccache: true
          # Linux wheels build in a manylinux/musllinux container: ort-sys
          # build-deps on ureq/native-tls → openssl-sys needs headers there
          # (no-op on windows/macos runners). Distro-aware per leg.
          before-script-linux: ${{ matrix.platform.pkg }}

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-cp${{ matrix.python-version }}
          path: dist

  # ------------------------------------------------------------------
  # 3. sdist + PyPI upload (single verified copy — no merge-multiple)
  # ------------------------------------------------------------------
  pypi-publish:
    needs: [pypi]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Download wheels (per-artifact dirs — never merge-multiple,
        # see legacy release postmortem: identical paths across artifacts
        # corrupt the merged zip)
        uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: dist

      - name: Flatten wheel directories (drop emptied artifact dirs —
        # the publisher rejects any non-distribution entry in dist/)
        run: |
          find dist -name '*.whl' -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          ls -la dist/

      - name: Publish to PyPI
        # Tags publish; manual dispatch stops after building wheels.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
