[build-system]
requires = ["setuptools>=77.0", "wheel"]  # >=77: PEP 639 license-expression support
build-backend = "setuptools.build_meta"

[project]
name = "bobine"
version = "0.2.0"
description = "Standalone PDF / Office / text → Markdown ingestion engine (extracted from OKFgraph)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    { name = "opticsWolf", email = "opticswolf@protonmail.com" },
]
keywords = ["pdf", "markdown", "ocr", "onnx", "latex", "ingestion", "rapidocr", "pdf-oxide"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/opticsWolf/bobine"
Repository = "https://github.com/opticsWolf/bobine"
Documentation = "https://github.com/opticsWolf/bobine/blob/main/README.md"

[project.optional-dependencies]
# Heavy conversion backends (all optional; the package imports without them).
# NOTE: RapidAI packages are exact-pinned (version-pinning philosophy — see
# bobine/versions.py). Pins verified to RESOLVE on PyPI as of 2026-08-08;
# runtime API verification against a real install is tracked in
# docs/IMPLEMENTATION_PLAN.md (open item #1).
pdf-ingest = [
    "pdf_oxide>=0.2.1",
    "office_oxide>=0.1.8",
    "rapidocr==3.9.2",
    "rapid_layout==1.2.1",
    "rapid_table==3.0.2",
    "numpy>=2.0",
]
# Legacy formula OCR (RapidLaTeXOCR, SURGICAL mode) is now VENDORED into
# bobine/_vendor/rapid_latex_ocr (MIT (c) 2023 RapidAI) with the numpy-2
# incompatibility fixed — no external package needed. These are the vendored
# code's runtime deps; models (~179 MB) auto-download on first use from
# github.com/RapidAI/RapidLaTeXOCR/releases/download/v0.0.0/.
formula = [
    "onnxruntime>=1.17",
    "tokenizers>=0.13.2",
    "opencv-python>=4.5",
    "chardet>=5.0",
    "requests>=2.28",
    "PyYAML>=6.0",
]
# Text-type document handling (markdown linting + frontmatter).
markdown = [
    "mordant>=0.8",
    "python-frontmatter>=1.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "reportlab>=4.0",  # scanned-page corpus generator (tests/fixtures/generate_corpus.py)
]

[tool.setuptools.packages.find]
include = ["bobine*"]

[tool.pytest]
addopts = ["-v", "--tb=short"]
markers = [
    "integration: requires optional native backends (bobine[pdf-ingest])",
    "slow: GPU-heavy or large-batch tests",
]

[tool.coverage.run]
source = ["bobine"]
omit = ["bobine/__init__.py", "bobine/_vendor/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["bobine/_vendor/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "RUF001", "RUF002", "RUF003", "W291"]  # asserts + intentional unicode/PDF-byte test content
